services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gimnasio
      POSTGRES_USER: ${DB_USER:-gimnasio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gimnasio} -d gimnasio"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
